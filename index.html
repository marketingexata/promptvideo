<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Video Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --card-alt: #f8fafc;
  --tx: #0f172a;
  --mut: #64748b;
  --ac: #4f46e5;
  --ac-h: #4338ca;
  --ac2: #eef2ff;
  --bd: #e2e8f0;
  --ok: #16a34a;
  --ok-bg: #dcfce7;
  --bad: #dc2626;
  --bad-bg: #fee2e2;
  --warn-bg: #fef9c3;
  --warn-tx: #854d0e;
  --sh: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
}
:root[data-theme=dark] {
  --bg: #0b0f19;
  --card: #151c2c;
  --card-alt: #1e293b;
  --tx: #f1f5f9;
  --mut: #94a3b8;
  --ac: #818cf8;
  --ac-h: #6366f1;
  --ac2: #1e2646;
  --bd: #2a364f;
  --ok: #4ade80;
  --ok-bg: #143523;
  --bad: #f87171;
  --bad-bg: #3b1818;
  --warn-bg: #362e14;
  --warn-tx: #fde047;
  --sh: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 15px/1.55 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  transition: background .2s, color .2s;
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--card);
  border-bottom: 1px solid var(--bd);
  padding: 12px 18px;
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.brand-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
}
.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--ac2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
header h1 { font-size: 16.5px; font-weight: 700; margin: 0; line-height: 1.2; }
header p.sub { margin: 0; font-size: 12px; color: var(--mut); }
header small#sv {
  color: var(--ok);
  background: var(--ok-bg);
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
header small#sv:empty { display: none; }
button, select, input, textarea { font: inherit; color: var(--tx); }
.ib {
  background: var(--card-alt);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}
.ib:hover { border-color: var(--ac); background: var(--ac2); }

main { max-width: 820px; margin: 0 auto; padding: 18px 14px 120px; }

/* STEPPER / PROGRESS WIZARD */
.stepper-wrap {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 18px;
  box-shadow: var(--sh);
}
.stepper-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 12.5px;
  color: var(--mut);
  font-weight: 600;
}
.progress-track {
  width: 100%;
  height: 6px;
  background: var(--bd);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 14px;
}
.progress-fill {
  height: 100%;
  background: var(--ac);
  border-radius: 99px;
  transition: width .3s ease;
}
.steps-nav {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.step-btn {
  border: 1px solid var(--bd);
  background: var(--card-alt);
  border-radius: 12px;
  padding: 8px 6px;
  cursor: pointer;
  text-align: center;
  transition: all .15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.step-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.step-btn .s-num {
  width: 24px;
  height: 24px;
  border-radius: 99px;
  background: var(--bd);
  color: var(--tx);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.step-btn .s-lbl {
  font-size: 11.5px;
  font-weight: 600;
  line-height: 1.2;
}
.step-btn.done {
  border-color: var(--ok);
  background: var(--card);
}
.step-btn.done .s-num {
  background: var(--ok);
  color: #fff;
}
.step-btn.active {
  border-color: var(--ac);
  background: var(--ac2);
  box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
}
.step-btn.active .s-num {
  background: var(--ac);
  color: #fff;
}

/* SUMMARY PILLS OF PREVIOUS CHOICES */
.summary-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}
.sum-pill {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 99px;
  padding: 4px 11px;
  font-size: 12px;
  color: var(--mut);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.sum-pill b { color: var(--tx); }
.sum-pill:hover { border-color: var(--ac); }

/* MAIN CARD */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 22px 20px;
  margin-bottom: 16px;
  box-shadow: var(--sh);
  animation: fadeIn .2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.step-badge {
  display: inline-block;
  background: var(--ac2);
  color: var(--ac);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  margin-bottom: 8px;
}
.card h2 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
.info, small {
  color: var(--mut);
  font-size: 13.5px;
  display: block;
  margin: 2px 0 14px;
}
.tip-box {
  background: var(--ac2);
  border-left: 4px solid var(--ac);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  margin: 10px 0 14px;
  color: var(--tx);
}

/* CHIPS / SELECTION CARDS */
.chips {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
  gap: 10px;
}
.chips.dur-chips {
  grid-template-columns: repeat(4, 1fr);
}
.chip {
  border: 1.5px solid var(--bd);
  background: var(--card-alt);
  border-radius: 14px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-weight: 600;
  transition: all .15s;
  position: relative;
}
.chip:hover {
  border-color: var(--ac);
  transform: translateY(-1px);
}
.chip.on {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
  box-shadow: 0 6px 14px -3px rgba(79, 70, 229, 0.35);
}
.chip span {
  display: block;
  font-size: 12px;
  font-weight: 400;
  opacity: .8;
  margin-top: 3px;
}

/* FORM INPUTS */
select, input[type=text], textarea {
  width: 100%;
  background: var(--card-alt);
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  padding: 11px 13px;
  margin-top: 4px;
  transition: border-color .15s, box-shadow .15s;
}
select:focus, input[type=text]:focus, textarea:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}
textarea { resize: vertical; line-height: 1.5; }
.lb {
  font-weight: 700;
  font-size: 14.5px;
  display: block;
  margin-top: 16px;
}

/* MASTER SCRIPT HIGHLIGHT BOX */
.master-box {
  background: var(--ac2);
  border: 1.5px solid var(--ac);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 18px;
}
.master-box .lb { margin-top: 0; color: var(--ac); font-size: 15px; }

/* SCENE CARDS */
.sc {
  border: 1.5px solid var(--bd);
  background: var(--card-alt);
  border-radius: 16px;
  padding: 16px;
  margin-top: 14px;
  transition: opacity .2s;
}
.sc.off { opacity: .55; border-style: dashed; }
.sh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--bd);
  margin-bottom: 8px;
}
.sh b { font-size: 15.5px; display: flex; align-items: center; gap: 6px; }
.sw {
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  padding: 5px 10px;
  border-radius: 99px;
  border: 1px solid var(--bd);
}
.sw input { width: 16px; height: 16px; accent-color: var(--ac); cursor: pointer; }

/* STATUS BADGES */
.bad {
  color: var(--bad) !important;
  background: var(--bad-bg);
  padding: 6px 10px;
  border-radius: 8px;
  font-weight: 600;
  margin-top: 6px;
}
.ok {
  color: var(--ok) !important;
  background: var(--ok-bg);
  padding: 6px 10px;
  border-radius: 8px;
  font-weight: 600;
  margin-top: 6px;
}

/* LOCATION PREVIEW */
.env-preview {
  background: var(--card-alt);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
}

/* BOTTOM NAVIGATION BAR */
.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  background: var(--card);
  border-top: 1px solid var(--bd);
  padding: 12px 16px;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.05);
}
.bar-inner {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
}
.nav-btn {
  background: var(--card-alt);
  color: var(--tx);
  border: 1.5px solid var(--bd);
  border-radius: 12px;
  padding: 12px 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.nav-btn:hover:not(:disabled) { border-color: var(--ac); background: var(--ac2); }
.nav-btn.primary {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
  flex: 1;
}
.nav-btn.primary:hover:not(:disabled) { background: var(--ac-h); }
.nav-btn:disabled { opacity: .4; cursor: not-allowed; }

.go {
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 13px 24px;
  font-weight: 700;
  font-size: 15.5px;
  cursor: pointer;
  flex: 1;
  box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
  transition: transform .15s, opacity .15s;
}
.go:hover:not(:disabled) { transform: translateY(-1px); }
.go:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }

/* RESULTS SECTION */
.res-banner {
  background: var(--ok-bg);
  color: var(--ok);
  border: 1px solid var(--ok);
  border-radius: 16px;
  padding: 14px 18px;
  margin-bottom: 14px;
  font-weight: 600;
  font-size: 14px;
}
.rh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.rh b { font-size: 15px; }
.res textarea {
  font: 12.5px/1.5 ui-monospace, Consolas, monospace;
  min-height: 210px;
  background: var(--bg);
}
#toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  background: #0f172a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 99px;
  font-weight: 600;
  font-size: 13.5px;
  opacity: 0;
  transition: .25s;
  pointer-events: none;
  z-index: 40;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
#toast.s { opacity: 1; transform: translateX(-50%) translateY(-4px); }
details summary {
  cursor: pointer;
  font-weight: 700;
  padding: 6px 0;
  user-select: none;
}
@media(max-width: 600px) {
  .step-btn .s-lbl { font-size: 10px; }
  .chips.dur-chips { grid-template-columns: repeat(2, 1fr); }
  header p.sub { display: none; }
}
@media(min-width: 700px) {
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
}
</style>
</head>
<body>
<header>
  <div class="brand-wrap">
    <div class="brand-icon">🎬</div>
    <div>
      <h1>Prompt Video Generator</h1>
      <p class="sub">Panduan langkah demi langkah membuat prompt video AI</p>
    </div>
  </div>
  <small id="sv"></small>
  <button class="ib" id="th" title="Mode cerah/gelap">🌓 Tema</button>

<main id="app"></main>

<div class="bar">

</div>

if(curStep>maxStep())curStep=maxStep();
save();render()}

const chip=(l,s,on,a)=>`<button type="button" class="chip ${on?'on':''}" ${a}>${l}${s?`<span>${s}</span>`:''}</button>`;
const card=(n,t,i,b)=>`<section class="card"><span class="step-badge">Langkah ${n} dari 5</span><h2>${t}</h2><small class="info">${i}</small>${b}</section>`;
const fld=(l,i,b)=>`<label class="lb">${l}</label><small>${i}</small>${b}`;
const cnt=i=>{const x=S.scenes[i],w=words(x.text),ok=w<=cap[x.dur];return[`${w} kata · Durasi ${x.dur} dtk (kapasitas ideal ±${cap[x.dur]} kata) ${ok?'✓ Pas!':'— Terlalu panjang, pilih durasi lebih lama atau pendekkan kalimat'}`,ok]};
const upd=i=>{const el=$('#cnt'+i);if(el){const[t,ok]=cnt(i);el.textContent=t;el.className=ok?'ok':'bad'}};
const CONJ=['dan','atau','yang','untuk','karena','sehingga','agar','tetapi','namun','dengan','saat','sebelum','setelah','bukan'];
function units(txt){const u=[],e=[];txt.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).filter(Boolean).forEach(s=>{const fine=[];s.trim().split(/(?<=[,:;])\s+/).filter(Boolean).forEach(c=>{let ws=c.split(' ');while(ws.length>9){const mid=ws.length>>1,cand=[];for(let i=3;i<ws.length-2;i++)if(CONJ.includes(ws[i].toLowerCase()))cand.push(i);const k=cand.length?cand.reduce((x,y)=>Math.abs(y-mid)<Math.abs(x-mid)?y:x):mid;fine.push(ws.slice(0,k).join(' '));ws=ws.slice(k)}fine.push(ws.join(' '))});fine.forEach((c,k)=>{u.push(c);e.push(k==fine.length-1?1:0)})});return[u,e]}
function distribute(){const t=S.customScript.trim(),e=en();if(!t){e.forEach(j=>{S.scenes[j].text=''});return}const[u,ends]=units(t),ps=part(u,e.length,ends);e.forEach((j,p)=>{const x=S.scenes[j];x.text=ps[p]||'';x.dur=sug(words(x.text));x.dirty=false})}
function syncScenes(){S.scenes.forEach((x,i)=>{const t=$(`textarea[data-s="${i}"][data-k=text]`);if(t&&x.on){t.value=x.text;upd(i);document.querySelectorAll(`[data-s="${i}"][data-k=dur]`).forEach(b=>b.classList.toggle('on',+b.dataset.v==x.dur))}});const c=$('#cstat');if(c)c.textContent=cstat()}
const cstat=()=>{const n=en().length,w=words(S.customScript);return`${w} kata total · ${n} scene aktif · kapasitas ±${22*n} kata (10 detik/scene)${w>22*n?' — kebanyakan, tambah scene atau pendekkan naskah':''}`};

function masterBox(){
  const l=sc(),n=en().length,c=S.master==='c';
  return `<div class="master-box">`+fld('⭐ Cara Cepat: Pilih Naskah Utama (Otomatis Dibagi ke Semua Scene)','Pilih 1 topik di bawah, maka Scene 1, 2, dan 3 akan langsung terisi otomatis dan rapi. Kamu tetap bisa mengeditnya di bawah.',`<select data-k="master"><option value="">— Pilih topik naskah siap pakai —</option>${l.map((s,k)=>`<option value="${k}" ${S.master===String(k)?'selected':''}>${k+1}. ${esc(s.t)}</option>`).join('')}<option value="c" ${c?'selected':''}>✏️ Tulis naskah sendiri dari awal</option></select>`+(c?`<textarea rows="5" data-k="customScript" placeholder="Tulis atau tempel naskah lengkapmu di sini dari kalimat pembuka sampai ajakan penutup (CTA). Sistem akan otomatis memecahnya ke setiap scene di bawah.">${esc(S.customScript)}</textarea><small id="cstat" class="info">${cstat()}</small>`:'')+(S.master!==''?`<button type="button" class="ib" style="margin-top:8px" data-k="redo" data-v="1">🔀 Bagi ulang naskah otomatis</button>`:''))+(n<3?`<small class="bad">⚠️ Hanya ${n} scene yang aktif, jadi naskah digabung ke ${n} bagian saja. Centang ke-3 scene di bawah jika ingin durasi tiap bagian lebih santai.</small>`:'')+`</div>`;
}

function sceneCard(i){
  const x=S.scenes[i],l=sc(),[ct,ok]=cnt(i);
  let b=`<div class="sh"><b>🎬 Bagian ${i+1}: ${['Pembuka (Hook)','Isi Penjelasan','Penutup & Ajakan (CTA)'][i]}</b><label class="sw"><input type="checkbox" data-s="${i}" data-k="on" ${x.on?'checked':''}> Aktifkan</label></div>`;
  if(x.on){
    if(i==0)b+=fld('🧲 Gaya Pembuka (Hook 3 Detik Pertama)','Bagaimana cara pemeran membuka video agar penonton tidak lanjut scroll?',`<select data-k="hook">${HOOKS.map((h,k)=>`<option value="${k}" ${S.hook==k?'selected':''}>${k+1}. ${h[0]}</option>`).join('')}<option value="c" ${S.hook=='c'?'selected':''}>✏️ Atur gaya pembuka sendiri</option></select>`+(S.hook=='c'?`<textarea rows="2" data-k="hookCustom" placeholder="Contoh: karakter membuka sambil mengangkat ponsel ke kamera">${esc(S.hookCustom)}</textarea>`:''));
    if(S.master!=='c')b+=fld('📂 Pilih Naskah Bagian Ini',l.length?'Otomatis mengikuti Naskah Utama di atas, atau ubah khusus untuk bagian ini saja:':'Belum ada naskah bawaan untuk kategori ini, silakan pilih Isi Sendiri.',`<select data-s="${i}" data-k="sel"><option value="">— Pilih naskah —</option>${l.map((s,k)=>`<option value="${k}" ${x.sel===String(k)?'selected':''}>${k+1}. ${esc(s.t)}</option>`).join('')}<option value="c" ${x.sel==='c'?'selected':''}>✏️ Isi sendiri</option></select>`);
    b+=fld('🎥 Gerakan & Adegan Visual (Opsional)','Apa yang dilakukan pemeran di layar? Jika dikosongkan, AI akan mengatur gerakan yang natural.',`<textarea rows="2" data-s="${i}" data-k="adegan" placeholder="Contoh: duduk santai sambil menjelaskan dengan gerakan tangan ramah">${esc(x.adegan)}</textarea>`);
    b+=fld('🗣️ Kalimat yang Diucapkan (Dialog)','Kata-kata persis yang akan diucapkan pemeran dalam Bahasa Indonesia.',`<textarea rows="3" data-s="${i}" data-k="text" placeholder="Tulis kalimat yang diucapkan pemeran pada bagian ini...">${esc(x.text)}</textarea><small id="cnt${i}" class="${ok?'ok':'bad'}">${ct}</small>`);
    b+=fld('⏱️ Durasi Bagian Ini','Pilih berapa detik lama video untuk bagian ini.',`<div class="chips dur-chips">${[4,6,8,10].map(d=>chip(d+' detik','',x.dur==d,`data-s="${i}" data-k="dur" data-v="${d}"`)).join('')}</div>`);
  }
  return`<div class="sc ${x.on?'':'off'}">${b}</div>`;
}

function stepperHTML(){
  const mx=maxStep();
  const steps=[
    [1,'Divisi',!!S.div],
    [2,'Kategori',!!S.cat],
    [3,'Pemeran',!!S.charMode],
    [4,'Lokasi',S.env!==''],
    [5,'Naskah',S.env!==''&&S.scenes.some(x=>x.on&&x.text.trim())]
  ];
  const pct=Math.min(100,Math.round(((curStep-1)/4)*100));
  return `<div class="stepper-wrap">
    <div class="stepper-top">
      <span>🧭 Panduan Langkah demi Langkah</span>
      <span>Langkah ${curStep} dari 5</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="steps-nav">
      ${steps.map(([num,lbl,done])=>{
        const act=curStep===num;
        const locked=num>mx;
        return `<button type="button" class="step-btn ${act?'active':''} ${done&&!act?'done':''}" data-step="${num}" ${locked?'disabled':''}>
          <span class="s-num">${done&&!act?'✓':num}</span>
          <span class="s-lbl">${lbl}</span>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

function summaryBarHTML(){
  const pills=[];
  if(S.div){
    const dName=S.div=='custom'?(S.brandCustom||'Brand Sendiri'):BR[S.div];
    pills.push(`<span class="sum-pill" data-step="1" title="Klik untuk ubah">🏢 Divisi: <b>${esc(dName)}</b></span>`);
  }
  if(S.cat){
    const cName=S.cat=='custom'?(S.catCustom||'Kategori Sendiri'):CATS.find(c=>c[0]==S.cat)?.[1]||S.cat;
    pills.push(`<span class="sum-pill" data-step="2" title="Klik untuk ubah">📌 Konten: <b>${esc(cName)}</b></span>`);
  }
  if(S.charMode){
    pills.push(`<span class="sum-pill" data-step="3" title="Klik untuk ubah">👤 Pemeran: <b>${S.charMode=='auto'?'Otomatis AI':'Karakter Khusus'}</b></span>`);
  }
  if(S.env!==''){
    const ev=envs()[+S.env];
    const eName=S.env=='c'?'Lokasi Sendiri':(ev?ev[0]:'Lokasi');
    pills.push(`<span class="sum-pill" data-step="4" title="Klik untuk ubah">📍 Lokasi: <b>${esc(eName)}</b></span>`);
  }
  return pills.length?`<div class="summary-bar">${pills.join('')}</div>`:'';
}

function render(){
  document.documentElement.dataset.theme=S.theme;
  const mx=maxStep();
  if(curStep>mx)curStep=mx;
  if(curStep<1)curStep=1;

  let h=stepperHTML()+summaryBarHTML();

  if(curStep===1){
    h+=card(1,'Pilih Divisi atau Brand','Video ini mau dibuat untuk layanan yang mana? Klik salah satu kartu di bawah.',
      `<div class="chips">${DIVS.map(d=>chip(d[1],d[2],S.div==d[0],`data-k="div" data-v="${d[0]}"`)).join('')}</div>`+
      (S.div=='custom'?fld('Nama Brand / Divisi Kamu','Ketik nama brand yang akan disebut di dalam video.',`<input type="text" data-k="brandCustom" value="${esc(S.brandCustom)}" placeholder="Contoh: Nama Brand Kamu">`):'')+
      `<div class="tip-box">💡 <b>Tips Pemula:</b> Pilihan divisi akan otomatis menyiapkan daftar naskah dan lokasi latar belakang yang paling cocok di langkah berikutnya.</div>`
    );
  }
  else if(curStep===2){
    h+=card(2,'Pilih Kategori Konten','Jenis video seperti apa yang ingin kamu tampilkan ke penonton?',
      `<div class="chips">${CATS.map(d=>chip(d[1],d[2],S.cat==d[0],`data-k="cat" data-v="${d[0]}"`)).join('')}</div>`+
      (S.cat=='custom'?fld('Nama Kategori Konten','Contoh: Behind the scene / Pengumuman','<input type="text" data-k="catCustom" value="'+esc(S.catCustom)+'" placeholder="Ketik jenis konten...">'):'')+
      `<div class="tip-box">💡 <b>Tips Pemula:</b> Pilih <b>QnA</b> atau <b>Edukasi</b> untuk menjawab kebingungan audiens, atau pilih <b>Promotion</b> untuk menawarkan layanan secara langsung.</div>`
    );
  }
  else if(curStep===3){
    h+=card(3,'Tentukan Pemeran Video (Karakter)','Siapa orang yang akan tampil dan berbicara di dalam video ini?',
      `<div class="chips">${chip('🤖 Biar AI yang Buat Otomatis','Praktis! AI akan membuatkan pemeran Indonesia yang profesional & natural',S.charMode=='auto','data-k="charMode" data-v="auto"')}${chip('📸 Pakai Karakter / Foto Khusus','Gunakan foto wajah referensi milikmu sendiri atau atur ciri pakaian khusus',S.charMode=='custom','data-k="charMode" data-v="custom"')}</div>`+
      (S.charMode=='custom'?`<div class="tip-box">📌 <b>Catatan:</b> Foto wajah aslinya nanti kamu lampirkan langsung di aplikasi Google Flow. Di bawah ini cukup tulis ciri tambahan jika diperlukan.</div><div class="g2"><div>${fld('Ciri Fisik Pemeran (Opsional)','Usia, gaya rambut, atau kesan wajah. Kosongkan jika ingin persis mengikuti foto.',`<textarea rows="2" data-k="charDesc" placeholder="Contoh: wanita 28 tahun, rambut hitam sebahu, senyum ramah">${esc(S.charDesc)}</textarea>`)}</div><div>${fld('Pakaian yang Dikenakan (Opsional)','Kosongkan jika ingin AI memilihkan baju yang rapi secara otomatis.',`<input type="text" data-k="charOutfit" value="${esc(S.charOutfit)}" placeholder="Contoh: kemeja kerja putih rapi">`)}</div></div>`:'')
    );
  }
  else if(curStep===4){
    const ev=envs();
    h+=card(4,'Pilih Latar Belakang (Lokasi Video)','Di mana suasana tempat video ini diambil? Kami sudah menyiapkan 15 pilihan tempat yang pas untukmu.',
      fld('Daftar Lokasi Siap Pakai','Pilih salah satu lokasi di bawah atau pilih "Isi sendiri" di bagian paling bawah daftar:',
      `<select data-k="env"><option value="">— Klik di sini untuk memilih lokasi —</option>${ev.map((e,k)=>`<option value="${k}" ${S.env===String(k)?'selected':''}>${k+1}. ${e[0]}</option>`).join('')}<option value="c" ${S.env=='c'?'selected':''}>✏️ Isi lokasi sendiri</option></select>`)+
      (S.env!==''&&S.env!='c'&&ev[+S.env]?`<div class="env-preview">🖼️ <div><b>Gambaran Suasana Visual:</b><br>${esc(ev[+S.env][1])}</div></div>`:'')+
      (S.env=='c'?fld('Tulis Deskripsi Lokasi Kamu','Jelaskan suasana tempat yang kamu inginkan secara singkat.',`<textarea rows="2" data-k="envCustom" placeholder="Contoh: kantor modern dengan jendela kaca besar dan tanaman hijau">${esc(S.envCustom)}</textarea>`):'')
    );
  }
  else if(curStep===5){
    h+=card(5,'Susun Adegan & Naskah Video','Video dibagi menjadi 3 bagian (Pembuka, Isi, Penutup) agar nyambung dan tidak terpotong. Pilih Naskah Utama di kotak biru agar semuanya terisi otomatis!',
      masterBox()+[0,1,2].map(sceneCard).join('')
    );
    h+=`<section class="card"><details><summary>⚙️ Pengaturan Teknis Video (Opsional — Sudah diatur otomatis, klik jika ingin mengubah)</summary><div class="g2"><div>${fld('Rasio Ukuran Layar','9:16 untuk TikTok/Reels/Shorts, 16:9 untuk YouTube mendatar.',`<select data-k="ar">${['9:16','16:9','1:1'].map(v=>`<option ${S.ar==v?'selected':''}>${v}</option>`).join('')}</select>`)}</div><div>${fld('Kualitas Resolusi Video','1080p memberikan hasil paling tajam.',`<select data-k="res">${['720p','1080p'].map(v=>`<option ${S.res==v?'selected':''}>${v}</option>`).join('')}</select>`)}</div></div>${fld('Jenis Suara Pemeran','Pilih suara Pria, Wanita, atau biarkan AI menyesuaikan otomatis.',`<select data-k="voice">${[['auto','Biar AI pilih otomatis'],['pria','Suara Pria'],['wanita','Suara Wanita']].map(v=>`<option value="${v[0]}" ${S.voice==v[0]?'selected':''}>${v[1]}</option>`).join('')}</select>`)}</details></section>`;
  }

  if(S.out){
    h+=`<div id="res"><div class="res-banner">🎉 <b>Prompt Video Berhasil Dibuat!</b><br>Cara pakai: Klik tombol <b>Salin Prompt</b> pada Scene 1 terlebih dahulu, lalu tempel (paste) ke Google Flow. Lanjutkan ke Scene 2 dan Scene 3 secara berurutan.</div>`+
    S.out.map((p,i)=>`<section class="card res"><div class="rh"><b>📋 Prompt Scene ${i+1}${p?' · Siap Salin':' (Tidak dipakai)'}</b>${p?`<button type="button" class="ib" data-copy="${i}">📋 Salin Prompt Scene ${i+1}</button>`:''}</div>${p?`<textarea readonly id="o${i}">${esc(p)}</textarea>`:'<small>Scene ini dimatikan sehingga tidak perlu dibuat.</small>'}</section>`).join('')+`</div>`;
  }

  $('#app').innerHTML=h;

  // Update Bottom Bar Buttons
  const prevB=$('#prevBtn'), nextB=$('#nextBtn'), goB=$('#go');
  prevB.style.display=curStep>1?'inline-block':'none';
  if(curStep<5){
    nextB.style.display='inline-block';
    nextB.disabled=curStep>=mx;
    goB.style.display='none';
  }else{
    nextB.style.display='none';
    goB.style.display='inline-block';
  }
  goB.disabled=!(S.div&&S.cat);
}

function build(){const e=en(),n=e.length,T=e.reduce((a,j)=>a+S.scenes[j].dur,0),q=v=>String(v).replace(/"/g,"'").replace(/\s*\n\s*/g,' ').trim();
const brand=S.div=='custom'?(S.brandCustom||A):BR[S.div],cat=S.cat=='custom'?(S.catCustom||A):CATS.find(c=>c[0]==S.cat)[1].replace(/^[^\w]+/,'').trim(),ev=envs()[+S.env],cu=S.env=='c'&&S.envCustom;
const loc=cu?S.envCustom:ev&&S.env!==''&&S.env!='c'?ev[0]:A,bg=cu?S.envCustom:ev&&S.env!==''&&S.env!='c'?ev[1]:A,vg={auto:A,pria:'Male',wanita:'Female'}[S.voice],cm=S.charMode=='custom';
const ref=cm?'Reference photo is attached manually in Google Flow. Use that exact person.':'NONE (generate an original character)',s0=sc()[+S.scenes[e[0]]?.sel],hk=S.hook=='c'?(S.hookCustom||A):HOOKS[+S.hook][1],hs=HOOKS[+S.hook]?.[2]&&S.hook!='c'?(s0?s0.h:(S.master==='c'&&S.customScript.trim().split(/(?<=[.!?])\s+/)[0])||'NONE'):'NONE';
return[0,1,2].map(i=>{const x=S.scenes[i];if(!x.on)return'';const p=e.indexOf(i),k=p==0?0:p==2?2:1,sel=sc()[+x.sel],dlg=x.text.trim()||'NONE (no speech in this scene)';
const M={PROJECT_NAME:`${brand} - ${cat}`,BRAND_NAME:brand,CONTENT_CATEGORY:cat,VIDEO_TITLE:(sel&&sel.t)||`${brand} ${cat}`,TOTAL_SCENES:n,VIDEO_MODEL:'Default model in Google Flow',ASPECT_RATIO:S.ar,VIDEO_RESOLUTION:S.res,LOCATION:loc,BACKGROUND_DESCRIPTION:bg,CHARACTER_ACTION:x.adegan.trim()||'AUTO (design natural actions, gestures and visuals that match the meaning of the dialogue)',CHARACTER_DESCRIPTION:cm&&S.charDesc?S.charDesc:A,CHARACTER_OUTFIT:cm&&S.charOutfit?S.charOutfit:A,CHARACTER_GENDER:vg,CHARACTER_REFERENCE_IMAGE:ref,ORIGINAL_CHARACTER_REFERENCE_IMAGE:ref,SPEAKING_LANGUAGE:'Indonesian (Bahasa Indonesia)',VOICE_GENDER:vg,VOICE_ACCENT:'Natural Indonesian accent',AUDIO_DELIVERY_MODE:'On-camera dialogue (the character speaks on screen)',PREVIOUS_SCENE_VIDEO:'Attach the previous scene video in Google Flow',SCENE_1_LAST_FRAME_REFERENCE:'Last frame of the previous scene (attach in Google Flow)',SCENE_2_LAST_FRAME_REFERENCE:'Last frame of the previous scene (attach in Google Flow)',VOICE_REFERENCE:'Same voice as the previous scene',CHARACTER_POSITION:'Continue exactly from the last frame of the previous scene',CHARACTER_FINAL_POSITION:'Natural closing position in the same location',HOOK_DELIVERY:hk,HOOK_ON_SCREEN_TEXT:hs,SCENE_2_CTA_IF_FINAL:n==2?'CTA is already included at the end of the exact dialogue (speak it once)':'NONE (this is not the final scene)',FINAL_CALL_TO_ACTION:'Already included at the end of SCENE_3_EXACT_DIALOGUE (do not speak it twice)',['SCENE_'+(k+1)+'_EXACT_DIALOGUE']:dlg};
let t=D.tpl[k].replace(/\{\{D\}\}/g,x.dur).replace(/\{\{T\}\}/g,T).replace(/\{\{N\}\}/g,n).replace(/^(\w+) = ""/gm,(m,key)=>`${key} = "${q(key in M?M[key]:/^(LOGO_|CONTACT|ADDITIONAL|FINAL_ON|HOOK_ON)/.test(key)?'NONE':A)}"`);
if(n==1)t='# IMPORTANT OVERRIDE: This is a SINGLE-SCENE video (not part of a series). Deliver the full dialogue and its call to action inside this one scene and end with a clean, natural closing frame. Ignore any requirement to prepare a continuation frame for another scene.\n\n'+t;return t})}

const toast=m=>{const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1800)};
const put=(t,v)=>{const k=t.dataset.k;if(t.dataset.s!==undefined)S.scenes[+t.dataset.s][k]=k=='dur'?+v:v;else S[k]=v};

document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.k||t.tagName=='SELECT'||t.type=='checkbox')return;put(t,t.value);if(t.dataset.k=='customScript'){distribute();syncScenes();save();return}if(t.dataset.s!==undefined){const i=+t.dataset.s;if(t.dataset.k=='text'||t.dataset.k=='adegan')S.scenes[i].dirty=true;upd(i)}save()});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName=='SELECT'||t.type=='checkbox'){put(t,t.type=='checkbox'?t.checked:t.value);after(t.dataset.k,+t.dataset.s)}});
document.addEventListener('click',e=>{
  const st=e.target.closest('[data-step]');
  if(st&&!st.disabled){curStep=+st.dataset.step;render();window.scrollTo({top:0,behavior:'smooth'});return}
  const b=e.target.closest('[data-v]');
  if(b){put(b,b.dataset.v);return after(b.dataset.k,+b.dataset.s)}
  const c=e.target.closest('[data-copy]');
  if(c){const ta=$('#o'+c.dataset.copy);ta.select();(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).catch(()=>document.execCommand('copy')).finally(()=>toast('✅ Prompt berhasil disalin!'))}
});

$('#prevBtn').onclick=()=>{if(curStep>1){curStep--;render();window.scrollTo({top:0,behavior:'smooth'})}};
$('#nextBtn').onclick=()=>{if(curStep<maxStep()){curStep++;render();window.scrollTo({top:0,behavior:'smooth'})}};
$('#go').onclick=()=>{S.out=build();save();render();$('#res')?.scrollIntoView({behavior:'smooth'});toast('✨ Prompt siap dipakai!')};
$('#th').onclick=()=>{S.theme=S.theme=='dark'?'light':'dark';save();render()};
$('#rs').onclick=()=>{if(confirm('Hapus semua isian dan mulai dari langkah 1?')){localStorage.removeItem('pvg1');S=blank();curStep=1;render();window.scrollTo({top:0,behavior:'smooth'})}};
if(S.mig){delete S.mig;if(S.cat&&S.div)S.scenes.forEach((x,j)=>{if(x.on&&x.sel!==''&&x.sel!=='c'&&!x.dirty)fill(j)});save()}
addEventListener('visibilitychange',save);addEventListener('pagehide',save);render();
</script>
</body>
</html>
