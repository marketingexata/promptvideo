<!DOCTYPE html>
<html lang="id">
<head>
<!-- Pengaturan dasar halaman -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViPro - Video Prompt Generator</title>

<!-- Ikon tab browser -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23111%22 stroke-width=%221.6%22><rect x=%223%22 y=%225%22 width=%2218%22 height=%2214%22 rx=%222%22/><path d=%22M3 9h18M7 5v4M12 5v4M17 5v4%22/></svg>">

<!-- Huruf (Google Fonts): Fraunces untuk judul, Inter untuk teks. Kalau offline, memakai huruf cadangan. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ============================ STYLE (CSS) ============================ -->
<style>

/* ============================================================
   VARIABEL WARNA DAN HURUF (mode cerah). Ganti warna utama di sini.
   ============================================================ */

:root {
  --bg: #f3f8fb;
  --card: #ffffff;
  --tx: #0b1b2b;
  --mut: #455b70;
  --ac: #0a4fd8;
  --cy: #06b6d4;
  --cyd: #0e7490;
  --ac2: #e3f3fa;
  --onac: #ffffff;
  --bd: #cfe0ea;
  --ok: #0e7490;
  --bad: #b3261e;
  --warn: #fff4dc;
  --warnb: #e0b45a;
  --sh: none;
  --ser: "Fraunces", "Playfair Display", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #07131d;
  --card: #0d1e2b;
  --tx: #e8f1f7;
  --mut: #9db3c4;
  --ac: #5aa9ff;
  --cy: #22d3ee;
  --cyd: #67e8f9;
  --ac2: #0f2f3f;
  --onac: #04121c;
  --bd: #1e3b4d;
  --ok: #67e8f9;
  --bad: #ff9b8f;
  --warn: #2a2412;
  --warnb: #6b5420;
}

/* ============================================================
   DASAR: reset, huruf, tombol, kolom isian
   ============================================================ */

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 16px/1.6 var(--sans);
  -webkit-text-size-adjust: 100%;
}
button,
select,
input,
textarea {
  font: inherit;
  color: var(--tx);
}
button {
  cursor: pointer;
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}

/* ============================================================
   IKON
   ============================================================ */

.ic {
  flex: none;
  vertical-align: -3px;
}

/* ============================================================
   HEADER DAN BAR LANGKAH (stepper)
   ============================================================ */

.top {
  position: sticky;
  top: 0;
  z-index: 6;
  background: var(--bg);
  border-bottom: 1px solid var(--bd);
}
header {
  padding: 12px 16px 6px;
  display: flex;
  gap: 10px;
  align-items: center;
  max-width: 760px;
  margin: 0 auto;
}
header h1 {
  font: 500 19px var(--ser);
  margin: 0;
  flex: 1;
  display: flex;
  gap: 8px;
  align-items: center;
  letter-spacing: -0.01em;
}
header small {
  color: var(--mut);
  font-size: 12px;
  margin: 0;
  white-space: nowrap;
}
.ib {
  background: transparent;
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 6px 9px;
  color: var(--tx);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}
.ib:hover {
  border-color: var(--ac);
}
#stp {
  max-width: 760px;
  margin: 0 auto;
  padding: 4px 16px 10px;
}
.stl {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mut);
}
.stl b {
  color: var(--tx);
  font-weight: 600;
}
.pb {
  height: 2px;
  background: var(--bd);
  margin: 8px 0 10px;
}
.pb i {
  display: block;
  height: 100%;
  background: var(--ac);
  transition: width 0.35s;
}
.st {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  gap: 2px;
}
.st li {
  flex: 1;
  min-width: 0;
}
.st button {
  width: 100%;
  background: none;
  border: 0;
  padding: 2px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11.5px;
  color: var(--mut);
}
.st button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.sd {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1px solid var(--bd);
  background: var(--bg);
  font-weight: 600;
  font-size: 12.5px;
}
.st li.on .sd,
.st li.done .sd {
  background: var(--ac);
  border-color: var(--ac);
  color: var(--onac);
}
.st li.on button {
  color: var(--tx);
  font-weight: 600;
}
.sl {
  display: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
@media (min-width: 640px) {
  .sl {
    display: block;
  }
}

/* ============================================================
   AREA KONTEN DAN JUDUL LANGKAH
   ============================================================ */

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 28px 16px 140px;
}
.hd h2 {
  font: 500 clamp(27px, 5.4vw, 36px)/1.15 var(--ser);
  letter-spacing: -0.02em;
  margin: 4px 0 8px;
}
.hd p {
  color: var(--mut);
  margin: 0 0 20px;
  max-width: 56ch;
}
.hd.sub {
  margin-top: 30px;
  border-top: 1px solid var(--bd);
  padding-top: 22px;
}
.hd.sub h3 {
  font: 500 22px var(--ser);
  margin: 0 0 4px;
}

/* ============================================================
   KARTU PILIHAN (divisi, jenis video, lokasi, naskah)
   ============================================================ */

.opts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
}
.opts.one {
  grid-template-columns: 1fr;
}
.opts.row {
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.opt {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 14px;
  min-height: 64px;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.opt:hover {
  border-color: var(--ac);
}
.opt.on {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
  background: var(--ac2);
}
.oi {
  flex: none;
  width: 38px;
  height: 38px;
  border: 1px solid var(--bd);
  border-radius: 6px;
  display: grid;
  place-items: center;
  font: 500 15px var(--ser);
  color: var(--tx);
}
.opt.on .oi {
  border-color: var(--ac);
}
.ot {
  flex: 1;
  min-width: 0;
}
.ot b {
  display: block;
  font-size: 15.5px;
  font-weight: 600;
}
.ot small {
  display: block;
  color: var(--mut);
  font-size: 13.5px;
  margin: 2px 0 0;
  line-height: 1.45;
}
.ck {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--ac);
  color: var(--onac);
  display: none;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
}
.opt.on .ck {
  display: grid;
}
.bd {
  position: absolute;
  top: -9px;
  right: 12px;
  background: var(--ac);
  color: var(--onac);
  font-style: normal;
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
  padding: 2px 9px;
  border-radius: 3px;
}

/* ============================================================
   FORM: label, keterangan, kolom isian
   ============================================================ */

.lb {
  font-weight: 600;
  display: block;
  margin-top: 18px;
  font-size: 12px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
small,
.info {
  color: var(--mut);
  font-size: 13.5px;
  display: block;
  margin: 3px 0 8px;
}
select,
input[type="text"],
textarea {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 11px 12px;
  margin-top: 4px;
}
textarea {
  resize: vertical;
  line-height: 1.55;
}
.g2 {
  display: grid;
  gap: 12px;
}
@media (min-width: 700px) {
  .g2 {
    grid-template-columns: 1fr 1fr;
  }
}

/* ============================================================
   KOTAK TIP DAN PERINGATAN
   ============================================================ */

.tip {
  background: var(--ac2);
  border-left: 2px solid var(--ac);
  padding: 10px 14px;
  margin-top: 16px;
  font-size: 14.5px;
}
.warn {
  background: var(--warn);
  border-left: 2px solid var(--warnb);
  padding: 10px 14px;
  margin: 12px 0;
  font-size: 14.5px;
}

/* ============================================================
   KARTU ADEGAN
   ============================================================ */

.sc {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 16px;
  margin-top: 14px;
}
.sc.off {
  opacity: 0.55;
}
.sh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.sn {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sn small {
  margin: 0;
}
.nb {
  width: 32px;
  height: 32px;
  border: 1px solid var(--ac);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 500 16px var(--ser);
}
.sw {
  font-size: 14px;
  display: flex;
  gap: 6px;
  align-items: center;
  cursor: pointer;
}
.sw input {
  width: 17px;
  height: 17px;
  accent-color: var(--ac);
}
.lnk {
  background: none;
  border: 0;
  color: var(--tx);
  font-weight: 600;
  padding: 10px 0;
  font-size: 14.5px;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 4px;
  display: inline-flex;
  gap: 6px;
  align-items: center;
}

/* ============================================================
   CHIP (durasi) dan ringkasan
   ============================================================ */

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  border: 1px solid var(--bd);
  background: var(--card);
  border-radius: 6px;
  padding: 8px 14px;
}
.chip.on {
  background: var(--ac);
  color: var(--onac);
  border-color: var(--ac);
}
.sum {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  overflow: hidden;
}
.sr {
  display: grid;
  grid-template-columns: 96px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--bd);
}
.sr:last-child {
  border-bottom: 0;
}
.sr span {
  color: var(--mut);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.sr b {
  font-size: 15px;
  font-weight: 600;
  word-break: break-word;
}
.sr .lnk {
  padding: 0;
  font-weight: 500;
}

/* ============================================================
   PANDUAN DAN HASIL PROMPT
   ============================================================ */

.how {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 14px 16px 14px 36px;
  margin: 0 0 8px;
}
.how li {
  margin: 5px 0;
}
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 16px;
  margin: 14px 0;
}
.rh {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.rh b {
  font: 500 18px var(--ser);
}
.res textarea {
  font:
    12.5px/1.5 ui-monospace,
    Consolas,
    monospace;
  min-height: 220px;
}

/* ============================================================
   BAR NAVIGASI BAWAH DAN TOMBOL
   ============================================================ */

.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  background: var(--bg);
  border-top: 1px solid var(--bd);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.nin {
  max-width: 728px;
  margin: 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
}
.nx {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  justify-content: flex-end;
}
.hint {
  max-width: 728px;
  margin: 0 auto 8px;
  color: var(--mut);
  font-size: 13px;
  text-align: center;
}
.btn {
  border-radius: 6px;
  padding: 13px 24px;
  font-weight: 600;
  font-size: 15px;
  border: 1px solid var(--ac);
}
.btn.pri {
  background: var(--ac);
  color: var(--onac);
}
.btn.sec {
  background: transparent;
  color: var(--tx);
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ============================================================
   STATUS (peringatan merah)
   ============================================================ */

.bad {
  color: var(--bad) !important;
}
.ok {
  color: var(--tx) !important;
}

/* ============================================================
   PALET BIRU-CYAN: aturan di bawah ini MENIMPA warna di atas. Untuk mengganti aksen, ubah variabel --ac (biru) dan --cy (cyan) di :root.
   ============================================================ */

::selection {
  background: var(--cy);
  color: #04222b;
}
.top {
  border-bottom-color: var(--cy);
}
.pb {
  background: var(--bd);
}
.pb i {
  background: linear-gradient(90deg, var(--ac), var(--cy));
}
header h1 .ic,
.ib,
.oi,
.btn.sec,
.lnk {
  color: var(--ac);
}
.hd h2::before {
  content: "";
  display: block;
  width: 40px;
  height: 3px;
  margin-bottom: 14px;
  background: linear-gradient(90deg, var(--ac), var(--cy));
}
.hd.sub {
  border-top-color: var(--cy);
}
.hd.sub h2::before {
  display: none;
}
.opt.on {
  border-color: var(--ac);
  box-shadow: inset 0 0 0 1px var(--ac);
  background: var(--ac2);
}
.opt.on .oi {
  border-color: var(--cy);
}
.ck,
.bd {
  background: var(--cy);
  color: #04222b;
}
.nb {
  border-color: var(--cy);
  color: var(--ac);
}
.tip {
  border-left-color: var(--cy);
}
.chip.on,
.btn.pri,
.st li.on .sd,
.st li.done .sd {
  background: var(--ac);
  border-color: var(--ac);
  color: var(--onac);
}
.btn.sec {
  border-color: var(--ac);
}
.ok {
  color: var(--ok) !important;
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline-color: var(--cy);
}
#toast {
  position: fixed;
  bottom: 96px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ac);
  color: var(--onac);
  padding: 9px 18px;
  border-radius: 6px;
  opacity: 0;
  transition: 0.3s;
  pointer-events: none;
  z-index: 9;
  font-size: 14px;
}
#toast.s {
  opacity: 1;
}

/* Tombol "Buka Google Flow" di halaman hasil prompt */
.btn.flow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  padding: 13px 24px;
  border-radius: 6px;
  border: 1px solid var(--ac, #0a4fd8);
  background: var(--ac, #0a4fd8);
  color: var(--onac, #ffffff);
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  cursor: pointer;
}
.btn.flow:hover {
  opacity: 0.9;
}

/* ============================================================
   RESPONSIF LAYAR HP KECIL
   ============================================================ */

@media (max-width: 480px) {
  .btn {
    padding: 13px 16px;
  }
  .sr {
    grid-template-columns: 78px 1fr auto;
  }
  .opts.row {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>
<!-- BAR ATAS: judul, status simpan, tombol tema, tombol hapus, dan bar langkah (diisi oleh JavaScript) -->
<div class="top">
<header>
<h1>
<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<rect x="3" y="5" width="18" height="14" rx="2"/>
<path d="M3 9h18M7 5v4M12 5v4M17 5v4"/>
</svg>
<span>ViPro</span>
</h1>
<small id="sv">
</small>
<button class="ib" id="th" title="Mode cerah/gelap" aria-label="Mode cerah atau gelap">
<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<circle cx="12" cy="12" r="9"/>
<path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
</svg>
</button>
<button class="ib" id="rs" title="Hapus semua isian" aria-label="Hapus semua isian">
<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
</svg>
</button>
</header>
<nav id="stp" aria-label="Langkah pengisian">
</nav>
</div>

<!-- AREA KONTEN: isi tiap langkah digambar oleh JavaScript ke sini -->
<main id="app"></main>

<!-- BAR BAWAH: tombol Kembali / Lanjut / Buat Prompt (diisi oleh JavaScript) -->
<div class="bar" id="nav"></div>

<!-- NOTIFIKASI KECIL -->
<div id="toast"></div>

<!-- ============================ JAVASCRIPT ============================ -->
<script>
// ==============================================================================
// PROMPT VIDEO GENERATOR - PETUNJUK UNTUK DEVELOPER
// ==============================================================================
// Semua kode ada di file ini. Urutannya dari atas ke bawah:
//   BAGIAN 1  DATA NASKAH          -> ubah / tambah isi naskah (SCRIPTS, satu baris = satu potongan)
//   BAGIAN 2  TEMPLATE PROMPT      -> teks master prompt, negative prompt, aturan voice over
//   BAGIAN 3  KONFIGURASI          -> divisi, jenis video, lokasi, hook, pilihan layar
//   BAGIAN 4  STATE                -> data isian + penyimpanan otomatis (localStorage)
//   BAGIAN 5  LOGIKA NASKAH        -> pemecah dan pembagi naskah ke adegan
//   BAGIAN 6  TAMPILAN             -> fungsi penggambar tiap langkah
//   BAGIAN 7  PEMBUAT PROMPT       -> build(): mengisi template dengan pilihan pengguna
//   BAGIAN 8  EVENT                -> klik, ketik, pilih dropdown
//   BAGIAN 9  INISIALISASI         -> dijalankan saat halaman dibuka
//
// CARA CEPAT MENGEDIT
//   - Ganti kalimat naskah       : BAGIAN 1, cari judulnya lalu edit baris-barisnya (akhiri kalimat dengan . ? !).
//   - Ganti aturan negative prompt: BAGIAN 2, konstanta NEG.
//   - Tambah lokasi              : BAGIAN 3, ENVB (per brand) atau ENVC (per jenis video).
//   - Tambah gaya pembuka video  : BAGIAN 3, HOOKS / HOOKV (jaga urutan 5-5-5).
//   - Ganti warna / huruf        : bagian <style> di atas, variabel di :root.
// Setelah mengedit, simpan file dan unggah ulang ke GitHub.
// ==============================================================================

// ==============================================================================
// BAGIAN 1 - DATA NASKAH
// Struktur: SCRIPTS -> brand -> jenis video -> 10 naskah.
// Setiap naskah: t = judul, text = daftar potongan kalimat (SATU BARIS = SATU POTONGAN).
// Urutan: hook (pembuka) -> isi -> ajakan (CTA) di baris paling akhir.
// Potongan yang berakhir tanda . ? ! dianggap ujung kalimat. Titik potong antar adegan hanya di antara baris-baris ini.
// Kategori Voice Over (VO) dibuat otomatis dari naskah Information, Education, dan Promotion.
// Jumlah kata ideal total naskah: sekitar 45-60 kata (3 adegan x 10 detik).
// ==============================================================================

const SCRIPTS = {
  // ----------------------------------------------------------------------
  // BRAND: EXATA Indonesia (Nenkin & Gensen)
  // ----------------------------------------------------------------------
  exata: {
    // ----- Kategori: QnA - tanya jawab (10 naskah) -----
    QNA: [
      {
        // 1
        t: 'Nenkin harus diurus kapan?',
        text: [
          'Baru pulang dari Jepang,',
          'langsung urus Nenkin?',

// Kata sambung tempat naskah boleh dipotong kalau satu klausa terlalu panjang.
const CONJ = [
  'dan',
  'atau',
  'yang',
  'untuk',
  'karena',
  'sehingga',
  'agar',
  'tetapi',
  'namun',
  'dengan',
  'saat',
  'sebelum',
  'setelah',
  'bukan',
];

// Memecah kalimat menjadi potongan kecil (anak kalimat) supaya bisa dibagi rata ke adegan.
function splitSentences(txt) {
  return txt
    .replace(/\s+/g, ' ')
    .trim()
    .split(/(?<=[.!?])\s+/)
    .filter(Boolean);
}

// Input: daftar kalimat. Output: [potongan, penanda] (penanda 1 = potongan ini ujung kalimat).
function unitsOf(sentences) {
  const u = [],
    e = [];
  sentences.forEach((s) => {
    const fine = [];
    s.trim()
      .split(/(?<=[,:;])\s+/)
      .filter(Boolean)
      .forEach((c) => {
        let ws = c.split(' ');
        while (ws.length > 9) {
          // klausa terlalu panjang: potong di kata sambung terdekat dari tengah
          const mid = ws.length >> 1,
            cand = [];
          for (let i = 3; i < ws.length - 2; i++) if (CONJ.includes(ws[i].toLowerCase())) cand.push(i);
          const k = cand.length
            ? cand.reduce((x, y) => (Math.abs(y - mid) < Math.abs(x - mid) ? y : x))
            : mid;
          fine.push(ws.slice(0, k).join(' '));
          ws = ws.slice(k);
        }
        fine.push(ws.join(' '));
      });
    fine.forEach((c, k) => {
      u.push(c);
      e.push(k == fine.length - 1 ? 1 : 0);
    });
  });
  return [u, e];
}

// Dipakai untuk naskah tulisan sendiri (satu teks panjang).
const units = (txt) => unitsOf(splitSentences(txt));

// Menyiapkan semua naskah bawaan: dari daftar potongan (text) menjadi sent, ends, dan h (kalimat hook).
Object.values(SCRIPTS).forEach((cats) =>
  Object.values(cats).forEach((list) =>
    list.forEach((s) => {
      const sent = s.text,
        ends = sent.map((u) => (/[.!?]$/.test(u) ? 1 : 0)); // 1 = potongan ini mengakhiri sebuah kalimat
      Object.assign(s, { h: sent.slice(0, ends.indexOf(1) + 1).join(' '), sent, ends });
    }),
  ),
);

});

// Helper: sc() = daftar naskah untuk divisi + jenis video terpilih, en() = daftar adegan aktif.

// Helper hitung kata dan saran durasi.
const words = (t) => (t.trim().match(/\S+/g) || []).length,
  sug = (w) => [4, 6, 8, 10].find((d) => cap[d] >= w) || 10;

// Helper: daftar 15 lokasi untuk pilihan saat ini (brand + jenis video).
const envs = () =>
  (ENVB[S.div] || ENVB.umum).concat(ENVC[S.cat] || ENVC.INFORMASI).map((x) => x.split('|'));

// PEMBAGI NASKAH: membagi potongan kalimat ke n adegan sehingga jumlah kata paling merata.
function part(sent, n, ends) {
  if (n == 1) return [sent.join(' ')];
  const w = sent.map((s) => words(s)),
    N = sent.length,
    sum = (a, b) => w.slice(a, b).reduce((x, y) => x + y, 0),
    pen = (i) => (ends[i - 1] ? 0 : 0.05);
  let bm = 1e9,
    bc = [1];
  for (let i = 1; i < N; i++) {
    if (n == 2) {
      const m = Math.max(sum(0, i), sum(i, N)) + pen(i);
      if (m < bm) {
        bm = m;
        bc = [i];
      }
    } else
      for (let j = i + 1; j < N; j++) {
        const m = Math.max(sum(0, i), sum(i, j), sum(j, N)) + pen(i) + pen(j);
        if (m < bm) {
          bm = m;
          bc = [i, j];
        }
      }
  }
  const c = [0, ...bc, N];
  return c.slice(1).map((e, k) => sent.slice(c[k], e).join(' '));
}

// Mengisi satu adegan dari naskah terpilih (kalimat, durasi, dan pilihan "Apa yang terlihat").
function fill(j) {
  const x = S.scenes[j],
    i = +x.sel,
    s = sc()[i];
  if (x.sel === '' || !s) return;
  const e = en(),
    n = e.length,
    p = e.indexOf(j),
    t = part(s.sent, n, s.ends)[p] || '';
  const role = p == 0 ? 'Pembuka' : p == n - 1 ? 'Penutup' : 'Lanjutan';
  Object.assign(x, { text: t, dur: 10, dirty: false });
  setAv(j);
}

// Membagi naskah pilihan ke SEMUA adegan aktif sekaligus.
const applyAll = (v) => {
  S.master = String(v);
  S.scenes.forEach((x, j) => {
    x.sel = String(v);
    if (x.on) fill(j);
  });
};

// Membagi NASKAH TULISAN SENDIRI ke adegan aktif secara otomatis.
function distribute() {
  const t = S.customScript.trim(),
    e = en();
  if (!t) {
    e.forEach((j) => {
      S.scenes[j].text = '';
    });
    return;
  }
  const [u, ends] = units(t),
    ps = part(u, e.length, ends);
  e.forEach((j, p) => {
    const x = S.scenes[j];
    x.text = ps[p] || '';
    x.dur = sug(words(x.text));
    x.dirty = false;
    setAv(j);
  });
}

const subjects = (t) => {
  const m = SUBJ.filter((r) => r[0].test(t))
      .map((r) => r[1])
      .slice(0, 3),
    d = SDEF[S.div] || SDEF.custom;
  while (m.length < 3) m.push(d);
  return m;
};

const avopts = (j) => {
  const s = subjects(S.scenes[j].text || ''),
    T = S.cat === 'VO' ? AVV : (AVC[S.cat] || AVC.INFORMASI).concat(AVG);
  return T.map((x, k) => x.replace('{s}', s[k % 3]));
};

const setAv = (j) => {
  const x = S.scenes[j];
  x.avis = String(j);
  x.adegan = avopts(j)[j];
};

// Dipanggil setelah pilihan diubah: reset bagian yang bergantung, bagi ulang naskah, simpan, lalu
// gambar ulang halaman.
function after(k, si) {
  if (k == 'avis') {
    const x = S.scenes[si],
      v = x.avis;
    if (v === '') x.adegan = '';
    else if (v !== 'c') x.adegan = avopts(si)[+v];
  }
  if (k == 'cat') {
    S.charMode = S.cat === 'VO' ? 'none' : S.charMode === 'none' ? '' : S.charMode;
    S.hook = '0';
  }
  if (k == 'div' || k == 'cat') {
    S.master = '';
    S.env = '';
    S.scenes.forEach((x) => Object.assign(x, { sel: '', adegan: '', text: '', dirty: false }));
  }
  if (k == 'sel') {
    const v = S.scenes[si].sel;
    if (v === 'c') Object.assign(S.scenes[si], { adegan: '', text: '', dirty: true });
    else if (v !== '') applyAll(v);
  }
  if (k == 'master' && S.master === 'c') {
    S.scenes.forEach((x) => {
      x.sel = 'c';
      x.adegan = '';
    });
    distribute();
  } else if ((k == 'master' || k == 'redo' || k == 'on') && S.master !== '') {
    if (S.master === 'c') distribute();
    else applyAll(S.master);
  }
  S.out = k == 'div' || k == 'cat' ? null : S.out;
  save();
  render();
}

      vo ? 'Viral clip' : 'Gerakan karakter',
    ],
    o = (a) =>
      H.map((x, k) =>
        k >= a && k < a + 5
          ? `<option value="${k}" ${S.hook == k ? 'selected' : ''}>${k - a + 1}. ${x[0]}</option>`
          : '',
      ).join('');
  return (
    `<div class="sc">` +
    fld(
      'Awalan video (hook 3 detik pertama)',
      'Hook awal video supaya penonton berhenti scroll layar.',
      `<select data-k="hook"><optgroup label="${G[0]}">${o(0)}</optgroup><optgroup label="${G[1]} (rekomendasi)">${o(5)}</optgroup><optgroup label="${G[2]} (rekomendasi)">${o(10)}</optgroup><option value="c" ${S.hook == 'c' ? 'selected' : ''}>Tulis sendiri</option></select>` +
        (S.hook == 'c'
          ? `<textarea rows="2" data-k="hookCustom" placeholder="Contoh: kamera bergerak maju pelan menuju meja">${esc(S.hookCustom)}</textarea>`
          : ''),
    ) +
    `</div>`
  );
};

// Susunan satu langkah adegan. s6, s7, s8 = Adegan 1, 2, 3.
const sS = (i) => {
  const role = ['Pembuka', 'Isi', 'Penutup dan ajakan'][i];
  return (
    head(
      `Scene ${i + 1}: ${role}`,
      [
        'Atur awalan video, lalu cek kalimat dan gerakan talent di scene pertama.',
        'Cek kalimat dan gerakan talent di scene kedua.',
        'Cek kalimat penutup dan ajakan, lalu atur gerakan talent di scene ketiga.',
      ][i],
    ) +
    (S.master === ''
      ? '<div class="warn">Pilih naskah dulu di langkah 5 : Naskah.</div>'
      : (i == 0 ? hookField() : '') + sceneCard(i))
  );
};

const s6 = () => sS(0),
  s7 = () => sS(1),
  s8 = () => sS(2);

// KARTU ADEGAN: kalimat yang diucapkan, "Apa yang terlihat di layar", dan lama adegan.
function sceneCard(i) {
  const x = S.scenes[i],
    [ct, ok] = cnt(i),
    role = ['Pembuka', 'Isi', 'Penutup dan ajakan'][i],
    o = S.open[i];
  let b = `<div class="sh"><div class="sn"><span class="nb">${i + 1}</span><div><b>Scene ${i + 1}</b><small>${role}</small></div></div><label class="sw"><input type="checkbox" data-s="${i}" data-k="on" ${x.on ? 'checked' : ''}> Pakai</label></div>`;
  if (x.on) {
    b += `<label class="lb">Kalimat yang diucap talent</label><textarea rows="4" data-s="${i}" data-k="text" placeholder="Tulis kalimat yang diucapkan...">${esc(x.text)}</textarea><small id="cnt${i}" class="${ok ? 'ok' : 'bad'}">${ct}</small>`;
    {
      b += fld(
        'Gerakan talent di layar',
        S.cat === 'VO'
          ? 'Footage yang tampil selama voice over. Pilih satu, atau tulis sendiri.'
          : 'Gerakan talent dan suasana di layar. Pilih satu, atau tulis sendiri.',
        `<select data-s="${i}" data-k="avis"><option value="">Biar AI yang atur</option>${avopts(i)
          .map(
            (a, k) =>
              `<option value="${k}" ${x.avis === String(k) ? 'selected' : ''}>${k + 1}. ${esc(a)}</option>`,
          )
          .join(
            '',
          )}<option value="c" ${x.avis === 'c' ? 'selected' : ''}>Tulis sendiri</option></select>` +
          (x.avis === 'c'
            ? `<textarea rows="2" data-s="${i}" data-k="adegan" placeholder="Contoh: close-up ponsel di atas meja">${esc(x.adegan)}</textarea>`
            : ''),
      );
      b += fld(
        'Durasi Scene',
        'Pilih berapa detik scene ini.',
        `<div class="chips">${[4, 6, 8, 10].map((d) => chip(d + ' detik', '', x.dur == d, `data-s="${i}" data-k="dur" data-v="${d}"`)).join('')}</div>`,
      );
    }
  }
  return `<div class="sc ${x.on ? '' : 'off'}">${b}</div>`;
}

// LANGKAH 5: pilih naskah (bawaan atau tulisan sendiri).
function s5() {

  else
    h += `<div class="opts one">${c ? opt('pencil', 'Naskah tulisan sendiri', '', true, 'data-x="1"') : opt('doc', esc(sel ? sel.t : ''), esc(sel ? sel.h : ''), true, 'data-x="1"')}</div><button type="button" class="lnk" data-tog="list">${svg('refresh', 16)} Ganti naskah</button>`;

      )

// Bar langkah di atas (judul langkah, progres, nomor).
function stepper(st) {
  const r = reach(),
    cur = Math.min(st, 9);
  $('#stp').innerHTML =
    `<div class="stl"><b>${st == 10 ? 'Selesai' : `Langkah ${cur} dari 9`}</b><span>${st == 10 ? 'Prompt siap disalin' : STEPS[cur - 1][0]}</span></div><div class="pb"><i style="width:${st == 10 ? 100 : Math.round((cur / 9) * 100)}%"></i></div><ol class="st">${STEPS.map(
      (s, k) => {
        const n = k + 1,
          done = n < cur || st == 10,
          on = n == cur && st < 10,
          can = n <= r;
        return `<li class="${on ? 'on' : ''} ${done ? 'done' : ''}"><button type="button" ${can ? `data-step="${n}"` : 'disabled'} ${on ? 'aria-current="step"' : ''}><span class="sd">${done ? '✓' : n}</span><span class="sl">${s[0]}</span></button></li>`;
      },
    ).join('')}</ol>`;
}

// Tombol Kembali / Lanjut / Buat Prompt di bagian bawah.
function navBar(st) {
  const nb = $('#nav');
  if (st == 10) {
    nb.innerHTML = `<div class="nin"><button type="button" class="btn sec" data-nav="edit">← Ubah isian</button><button type="button" class="btn pri" data-nav="new">＋ Video baru</button></div>`;
    return;
  }
  const ok = OK[st]();
  nb.innerHTML = `${!ok && HINT[st] ? `<div class="hint">${HINT[st]}</div>` : ''}<div class="nin">${st > 1 ? '<button type="button" class="btn sec" data-nav="back">← Kembali</button>' : '<span></span>'}<div class="nx"><button type="button" class="btn pri" data-nav="${st == 9 ? 'go' : 'next'}" ${ok ? '' : 'disabled'}>${st == 9 ? 'Buat Prompt' : 'Lanjut →'}</button></div></div>`;
}

// Menggambar ulang bar atas dan bawah.
const sync = () => {
  if (S.step < 10) {
    stepper(S.step);
    navBar(S.step);
  }
};

// FUNGSI UTAMA TAMPILAN: menggambar halaman sesuai langkah aktif. Daftar fungsi langkah ada di
// array di dalamnya.
function render() {
  document.documentElement.dataset.theme = S.theme;
  if (!S.open || typeof S.open != 'object') S.open = {};
  let st = +S.step || 1;
  if (st > 10) st = 10;
  if (st < 10) st = Math.max(1, Math.min(st, reach()));
  if (st == 10 && !S.out) st = 9;
  S.step = st;
  $('#app').innerHTML =
    `<div class="wz">${[null, s1, s2, s3, s4, s5, s6, s7, s8, s9, sR][st]()}</div>`;
  stepper(st);
  navBar(st);
}

// Pindah langkah (dengan batas langkah yang sudah boleh dibuka).
const goto = (n) => {
  S.step = Math.max(1, Math.min(n, 10));
  save();
  render();
  scrollTo({ top: 0, behavior: 'smooth' });
};


// ==============================================================================
// BAGIAN 7 - PEMBUAT PROMPT
// build() menghasilkan 3 prompt (adegan 1, 2, 3) dari pilihan pengguna.
// ==============================================================================

// PEMBUAT PROMPT: mengisi template master dengan pilihan pengguna. Kolom kosong diisi A
// (otomatis). Aturan Voice Over dan negative prompt ditambahkan di sini.
function build() {
  const e = en(),
    n = e.length,
    T = e.reduce((a, j) => a + S.scenes[j].dur, 0),
    q = (v) =>
      String(v)
        .replace(/"/g, "'")
        .replace(/\s*\n\s*/g, ' ')
        .trim();
  const brand = S.div == 'custom' ? S.brandCustom || A : BR[S.div],
    cat = S.cat == 'custom' ? S.catCustom || A : CATS.find((c) => c[0] == S.cat)[1],
    ev = envs()[+S.env],
    cu = S.env == 'c' && S.envCustom;
  const loc = cu ? S.envCustom : ev && S.env !== '' && S.env != 'c' ? ev[0] : A,
    bg = cu ? S.envCustom : ev && S.env !== '' && S.env != 'c' ? ev[1] : A,
    vg = { auto: A, pria: 'Male', wanita: 'Female' }[S.voice],
    cm = S.charMode == 'custom',
    vo = S.cat === 'VO',
    NC = 'NONE (no on-screen character; voice-over only)';
  const ref = cm
      ? 'Reference photo is attached manually in Google Flow. Use that exact person.'
      : 'NONE (generate an original character)',
    s0 = sc()[+S.scenes[e[0]]?.sel],
    H = vo ? HOOKV : HOOKS,
    hk = S.hook == 'c' ? S.hookCustom || A : H[+S.hook][1],
    hs =
      H[+S.hook]?.[2] && S.hook != 'c'
        ? s0
          ? s0.h
          : (S.master === 'c' && S.customScript.trim().split(/(?<=[.!?])\s+/)[0]) || 'NONE'
        : 'NONE';
  return [0, 1, 2].map((i) => {
    const x = S.scenes[i];
    if (!x.on) return '';
    const p = e.indexOf(i),
      k = p == 0 ? 0 : p == 2 ? 2 : 1,
      sel = sc()[+x.sel],
      dlg = x.text.trim() || 'NONE (no speech in this scene)';
    const M = {
      PROJECT_NAME: `${brand} - ${cat}`,
      BRAND_NAME: brand,
      CONTENT_CATEGORY: cat,
      VIDEO_TITLE: (sel && sel.t) || `${brand} ${cat}`,
      TOTAL_SCENES: n,
      VIDEO_MODEL: 'Default model in Google Flow',
      ASPECT_RATIO: S.ar,
      VIDEO_RESOLUTION: 'AUTO (follow the resolution selected in the Google Flow settings)',
      LOCATION: loc,
      BACKGROUND_DESCRIPTION: bg,
      CHARACTER_ACTION:
        x.adegan.trim() ||
        'AUTO (design natural actions, gestures and visuals that match the meaning of the dialogue)',
      CHARACTER_DESCRIPTION: cm && S.charDesc ? S.charDesc : A,
      CHARACTER_OUTFIT: cm && S.charOutfit ? S.charOutfit : A,
      CHARACTER_GENDER: vg,
      CHARACTER_REFERENCE_IMAGE: ref,
      ORIGINAL_CHARACTER_REFERENCE_IMAGE: ref,
      SPEAKING_LANGUAGE: 'Indonesian (Bahasa Indonesia)',
      VOICE_GENDER: vg,
      VOICE_ACCENT: 'Natural Indonesian accent',
      AUDIO_DELIVERY_MODE: 'On-camera dialogue (the character speaks on screen)',
      PREVIOUS_SCENE_VIDEO: 'Attach the previous scene video in Google Flow',
      SCENE_1_LAST_FRAME_REFERENCE: 'Last frame of the previous scene (attach in Google Flow)',
      SCENE_2_LAST_FRAME_REFERENCE: 'Last frame of the previous scene (attach in Google Flow)',
      VOICE_REFERENCE: 'Same voice as the previous scene',
      CHARACTER_POSITION: 'Continue exactly from the last frame of the previous scene',
      CHARACTER_FINAL_POSITION: 'Natural closing position in the same location',
      HOOK_DELIVERY: hk,
      HOOK_ON_SCREEN_TEXT: hs,
      SCENE_2_CTA_IF_FINAL:
        n == 2
          ? 'CTA is already included at the end of the exact dialogue (speak it once)'
          : 'NONE (this is not the final scene)',
      FINAL_CALL_TO_ACTION:
        'Already included at the end of SCENE_3_EXACT_DIALOGUE (do not speak it twice)',
      ['SCENE_' + (k + 1) + '_EXACT_DIALOGUE']: dlg,
    };
    Object.assign(M, {
      BACKGROUND_AUDIO: 'NONE (voice only: no background music, no sound effects)',
      HOOK_ON_SCREEN_TEXT: 'NONE',
      FINAL_ON_SCREEN_TEXT: 'NONE',
    });
    if (vo)
      Object.assign(M, {
        CHARACTER_REFERENCE_IMAGE: NC,
        ORIGINAL_CHARACTER_REFERENCE_IMAGE: NC,
        CHARACTER_DESCRIPTION: NC,
        CHARACTER_OUTFIT: NC,
        CHARACTER_GENDER: NC,
        CHARACTER_EXPRESSION: NC,
        CHARACTER_PERSONALITY: NC,
        CHARACTER_POSITION: NC,
        CHARACTER_FINAL_POSITION: NC,
        AUDIO_DELIVERY_MODE: 'Voice-over narration only (no on-screen speaker, no lip-sync)',
        BACKGROUND_AUDIO:
          'NONE (clean voice-over only: no background music, no sound effects, no ambient noise)',
        VOICE_CHARACTERISTICS: 'Clear, warm, professional narrator',
        CHARACTER_ACTION:
          'FOOTAGE ONLY (no person speaking): ' +
          (x.adegan.trim() || 'AUTO (choose footage that matches the narration)'),
      });
    let t = D.tpl[k]
      .replace(/\{\{D\}\}/g, x.dur)
      .replace(/\{\{T\}\}/g, T)
      .replace(/\{\{N\}\}/g, n)
      .replace(
        /^(\w+) = ""/gm,
        (m, key) =>
          `${key} = "${q(key in M ? M[key] : /^(LOGO_|CONTACT|ADDITIONAL|FINAL_ON|HOOK_ON)/.test(key) ? 'NONE' : A)}"`,
      );
    if (vo) t = VON + '\n\n' + t;
    if (n == 1)
      t =
        '# IMPORTANT OVERRIDE: This is a SINGLE-SCENE video (not part of a series). Deliver the full dialogue and its call to action inside this one scene and end with a clean, natural closing frame. Ignore any requirement to prepare a continuation frame for another scene.\n\n' +
        t;
    return t + '\n\n' + NEG;
  });
}


// ==============================================================================
// BAGIAN 8 - EVENT (KLIK, KETIK, PILIH)
// ==============================================================================

// Notifikasi kecil di bawah layar.
const toast = (m) => {
  const t = $('#toast');
  t.textContent = m;
  t.className = 's';
  setTimeout(() => (t.className = ''), 1800);
};

// Menyimpan nilai dari kolom isian ke state (berdasarkan atribut data-k dan data-s).
const put = (t, v) => {
  const k = t.dataset.k;
  if (t.dataset.s !== undefined) S.scenes[+t.dataset.s][k] = k == 'dur' ? +v : v;
  else S[k] = v;
};

// Saat mengetik di kolom teks: simpan tanpa menggambar ulang.
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.dataset.k || t.tagName == 'SELECT' || t.type == 'checkbox') return;
  put(t, t.value);
  if (t.dataset.k == 'customScript') {
    distribute();
    syncScenes();
    save();
    return;
  }
  if (t.dataset.s !== undefined) {
    const i = +t.dataset.s;
    if (t.dataset.k == 'text' || t.dataset.k == 'adegan') S.scenes[i].dirty = true;
    upd(i);
  }
  save();
});

// Saat memilih dropdown atau centang: simpan lalu gambar ulang.
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.tagName == 'SELECT' || t.type == 'checkbox') {
    put(t, t.type == 'checkbox' ? t.checked : t.value);
    after(t.dataset.k, +t.dataset.s);
  }
});

// Klik tombol pilihan (chip/kartu) dan tombol salin prompt.
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-v]');
  if (b) {
    put(b, b.dataset.v);
    return after(b.dataset.k, +b.dataset.s);
  }
  const c = e.target.closest('[data-copy]');
  if (c) {
    const ta = $('#o' + c.dataset.copy);
    ta.select();
    (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject())
      .catch(() => document.execCommand('copy'))
      .finally(() => toast('Prompt tersalin'));
  }
});

// Klik tombol navigasi (lanjut, kembali, buat prompt, ubah, video baru).
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-nav],[data-step],[data-tog]');
  if (!t || t.disabled) return;
  if (t.dataset.tog !== undefined) {
    S.open[t.dataset.tog] = !S.open[t.dataset.tog];
    save();
    render();
    return;
  }
  if (t.dataset.step) {
    goto(+t.dataset.step);
    return;
  }
  const a = t.dataset.nav;
  if (a == 'next') {
    if (OK[S.step]()) goto(S.step + 1);
  } else if (a == 'back') goto(S.step - 1);
  else if (a == 'go') {
    S.out = build();
    S.step = 10;
    save();
    render();
    scrollTo({ top: 0, behavior: 'smooth' });
    toast('Prompt jadi');
  } else if (a == 'edit') goto(9);
  else if (a == 'new') {
    if (confirm('Mulai video baru? Semua isian sekarang akan dihapus.')) {
      localStorage.removeItem('pvg1');
      S = blank();
      render();
      scrollTo(0, 0);
    }
  }
});

// Tombol mode cerah/gelap.
$('#th').onclick = () => {
  S.theme = S.theme == 'dark' ? 'light' : 'dark';
  save();
  render();
};

// Tombol hapus semua isian.
$('#rs').onclick = () => {
  if (confirm('Hapus semua isian dan mulai dari awal?')) {
    localStorage.removeItem('pvg1');
    S = blank();
    render();
  }
};

// BAGIAN 9 - INISIALISASI
// Dijalankan sekali saat halaman dibuka.
// ==============================================================================

// Migrasi data dari versi lama (aman diabaikan).
if (S.mig) {
  delete S.mig;
  if (S.cat && S.div)
    S.scenes.forEach((x, j) => {
      if (x.on && x.sel !== '' && x.sel !== 'c' && !x.dirty) fill(j);
    });
  save();
}

if (S.m3) {
  delete S.m3;
  if (S.step == 7) S.step = 10;
  else if (S.step == 6) S.step = 9;
}

if (S.m4) {
  delete S.m4;
  S.hook = '0';
}

if (S.nostep) {
  delete S.nostep;
  S.step = Math.min(reach(), 9);
}

// Simpan otomatis saat tab ditutup atau layar terkunci.
addEventListener('visibilitychange', save);
addEventListener('pagehide', save);

// Tampilkan halaman pertama kali.
render();
</script>
</body>
</html>
